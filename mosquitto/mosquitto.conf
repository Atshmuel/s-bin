# S-Bin's private MQTT broker (2i). Devices connect on 8883 with TLS (the
# site's Let's Encrypt certificate, copied by sync-certs.sh); the server on
# 1883, reachable only over the compose network. Every client logs in: the
# accounts and what each may publish or read are in the dynamic-security file
# (made once by setup.sh; the server adds and removes the devices').
per_listener_settings false
allow_anonymous false
plugin /usr/lib/mosquitto_dynamic_security.so
plugin_opt_config_file /mosquitto/data/dynamic-security.json

persistence true
persistence_location /mosquitto/data/
log_dest stdout

listener 1883

listener 8883
certfile /mosquitto/certs/fullchain.pem
keyfile /mosquitto/certs/privkey.pem
