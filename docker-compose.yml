services:
  server:
    image: shmuela/sbin-server:latest
    container_name: sbin-server
    restart: always
    env_file:
      - ./server/.env
    environment:
      # Required for `secure` cookies. Never set in .env, so all auth cookies
      # were being issued without the Secure flag in production.
      - NODE_ENV=production
    # Reachable only over the internal compose network, as `sbin-server:3002`.
    # Publishing it exposed the API over plain HTTP, bypassing nginx TLS.
    expose:
      - "3002"

  client:
    image: shmuela/sbin-client:latest
    container_name: sbin-client
    restart: always
    depends_on:
      - server
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./client/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./webroot:/var/www/html:ro
      - ./certbot-etc:/etc/letsencrypt:ro
  # Road routing for Israel (OSRM), read only by the route optimizer below.
  # Its data is prepared once, and refreshed now and then, with
  # routing/prepare-osrm.sh; the image tag must match the script's. A
  # distance table takes up to 1000 locations (OSRM's default is 100), as many
  # as VROOM's maxlocations.
  osrm:
    image: ghcr.io/project-osrm/osrm-backend:v26.4.0
    container_name: sbin-osrm
    restart: always
    command: osrm-routed --algorithm mld --max-table-size 1000 /data/israel-and-palestine-latest.osrm
    volumes:
      - ./routing/osrm:/data:ro
    expose:
      - "5000"

  # The route optimizer (VROOM, the engine behind OpenRouteService's
  # optimization). The server posts its jobs here when ROUTE_ENGINE=vroom and
  # ROUTE_OPTIMIZATION_API_URL=http://sbin-vroom:3000 in server/.env.
  vroom:
    image: ghcr.io/vroom-project/vroom-docker:v1.15.0
    container_name: sbin-vroom
    restart: always
    depends_on:
      - osrm
    environment:
      - VROOM_ROUTER=osrm
    volumes:
      - ./routing/vroom-conf:/conf
    expose:
      - "3000"
