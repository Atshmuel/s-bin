services:
  server:
    image: shmuela/sbin-server:latest
    container_name: sbin-server
    restart: always
    env_file:
      - ./server/.env
    environment:
      # Required for `secure` cookies. Never set in .env, so all auth cookies
      # were being issued without the Secure flag in production.
      - NODE_ENV=production
    # Reachable only over the internal compose network, as `sbin-server:3002`.
    # Publishing it exposed the API over plain HTTP, bypassing nginx TLS.
    expose:
      - "3002"

  client:
    image: shmuela/sbin-client:latest
    container_name: sbin-client
    restart: always
    depends_on:
      - server
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./client/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./webroot:/var/www/html:ro
      - ./certbot-etc:/etc/letsencrypt:ro