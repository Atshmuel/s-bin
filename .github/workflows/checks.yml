name: Checks - Lint & Tests

# On every branch push; master-main runs it from the deploy workflow first,
# so nothing that fails here is built or deployed.
on:
  push:
    branches-ignore:
      - master-main
  workflow_call:

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The version the server and client images run.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json

      - name: Lint the client
        working-directory: client
        run: |
          npm ci --no-audit --no-fund
          npm run lint

      - name: Test the server
        working-directory: server
        run: |
          npm ci --no-audit --no-fund
          npm test
